<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <!-- place navbar here -->
    </header>
    <main>
      <!-- Aqui debeis crear vuestras cards etc, para meter los datos del json-->

      <!-- Here you have to create your cards , and some other elements, to insert the data from the json-->

      <!-- como ejemplo, os dejamos un acordeon ya creado, pero la estructura para mostrarlo es la que vosotros queráis
           tened cuidado con los controles del acordeon-->
      <!-- as an example, we have created an accordeon, but you have to decide the structure to show the results 
           be careful with the controlls of the accordeon-->

      <div class="row" id="heroes"></div>
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Hidden template for the hero card -->
    <template id="card-template">
      <div class="col-sm-6 col-md-4 col-xl-3 d-flex mt-3">
        <div class="card flex-fill">
          <img class="card-img-top" src="" alt="" />
          <div class="card-body">
            <h4 class="card-title">Name</h4>
            <p class="card-text">Description</p>
          </div>

          <div class="accordion">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#comics"
                  aria-expanded="false"
                  aria-controls="comics"
                >
                  Comics
                </button>
              </h2>
              <div id="comics" class="accordion-collapse collapse">
                <div class="accordion-body">Comics list</div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#series"
                  aria-expanded="false"
                  aria-controls="series"
                >
                  Series
                </button>
              </h2>
              <div id="series" class="accordion-collapse collapse">
                <div class="accordion-body">Series list</div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#stories"
                  aria-expanded="false"
                  aria-controls="stories"
                >
                  Stories
                </button>
              </h2>
              <div id="stories" class="accordion-collapse collapse">
                <div class="accordion-body">Stories list</div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#events"
                  aria-expanded="false"
                  aria-controls="events"
                >
                  Events
                </button>
              </h2>
              <div id="events" class="accordion-collapse collapse">
                <div class="accordion-body">Events list</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <script src="./jspractica.js"></script>
  </body>
</html>
